<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Nuclear Option Map</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="map-app" aria-label="Nuclear Option map">
      <canvas
        id="map-canvas"
        tabindex="0"
        aria-label="Map view. Arrow keys pan; plus and minus zoom; zero fits the map."
      ></canvas
      ><canvas id="map-overlay" aria-hidden="true"></canvas>
      <header class="topbar">
        <div class="switcher-wrap">
          <button
            id="map-switcher"
            class="panel brand"
            type="button"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="map-menu"
          >
            <span class="brand-title" aria-hidden="true">NO</span
            ><span id="map-name">Choose map</span><span id="chevron-icon"></span>
          </button>
          <div id="map-menu" class="panel menu" role="listbox" aria-label="Maps" hidden></div>
        </div>
        <div class="jump-wrap">
          <button
            id="search-open"
            class="icon-button mobile-search"
            aria-label="Search map"
            type="button"
          ></button>
          <div id="jump-panel" class="panel jump-panel">
            <span id="search-icon"></span
            ><input
              id="jump-input"
              type="search"
              autocomplete="off"
              spellcheck="false"
              aria-label="Jump to grid, coordinates, or pin"
              aria-controls="jump-results"
              aria-expanded="false"
              placeholder="Jump to grid, coordinates or pin…"
            /><kbd>/</kbd>
            <div id="jump-results" class="jump-results" role="listbox" hidden></div>
          </div>
        </div>
        <div class="top-actions">
          <a id="status-chip" class="panel status-chip" href="/status/" hidden
            ><span class="status-dot"></span><span id="status-text">Status</span></a
          ><button
            id="settings-open"
            class="panel icon-button"
            type="button"
            aria-label="Settings"
            aria-expanded="false"
          ></button>
        </div>
      </header>
      <nav id="tools-rail" class="panel tools-rail" role="toolbar" aria-label="Map tools">
        <button
          type="button"
          data-tool="navigate"
          aria-label="Navigate"
          aria-pressed="true"
          title="Navigate (V)"
        ></button
        ><button
          type="button"
          data-tool="measure"
          aria-label="Measure"
          aria-pressed="false"
          title="Measure (M)"
        ></button
        ><button
          type="button"
          data-tool="pin"
          aria-label="Drop pin"
          aria-pressed="false"
          title="Drop pin (P)"
        ></button
        ><span class="rail-divider"></span
        ><button
          type="button"
          id="places-open"
          aria-label="Places"
          aria-expanded="false"
          title="Places (B)"
        ></button
        ><button
          type="button"
          id="layers-open"
          aria-label="Layers"
          aria-expanded="false"
          title="Layers (L)"
        ></button>
      </nav>
      <section id="minimap" class="panel minimap" aria-label="Overview map">
        <div class="minimap-heading">
          <span class="eyebrow">Overview</span
          ><button
            id="minimap-collapse"
            class="mini-button"
            type="button"
            aria-label="Collapse overview"
            aria-expanded="true"
          >
            −
          </button>
        </div>
        <div
          id="minimap-surface"
          class="minimap-surface"
          role="button"
          tabindex="0"
          aria-label="Move map view"
        >
          <div id="minimap-viewport"></div>
        </div>
      </section>
      <div class="zoom-stack panel">
        <button id="zoom-in" type="button" aria-label="Zoom in">+</button
        ><button id="zoom-out" type="button" aria-label="Zoom out">−</button
        ><button id="fit" type="button" aria-label="Fit map">⛶</button
        ><span id="zoom-badge">—</span>
      </div>
      <div class="bottom-left">
        <div id="scale-bar" class="scale-bar mono">
          <span id="scale-line"></span><span id="scale-label">—</span>
        </div>
        <div id="view-cards" class="view-cards" role="group" aria-label="Map views"></div>
      </div>
      <div class="bottom-center">
        <div id="water-preview" class="panel water-preview" hidden>
          <span id="water-preview-status"></span
          ><a href="/status/#coverage-sec">Coverage and gaps</a>
        </div>
        <div class="panel readout">
          <button
            id="readout-copy"
            class="readout-text mono"
            type="button"
            aria-label="Copy coordinates"
          >
            <span id="readout">Grid — · x — · z — · 1 px = —</span></button
          ><span id="interval-chip" class="interval-chip" hidden></span
          ><button
            id="copy-link"
            class="icon-button"
            type="button"
            aria-label="Copy view link"
            title="Copy view link"
          ></button>
        </div>
      </div>
      <div id="load-state" class="load-state" role="status" aria-live="polite">
        <div class="load-card panel">
          <span class="load-mark"></span><strong id="load-title">Starting map engine</strong
          ><span id="load-detail">Initializing WASM…</span
          ><button id="load-retry" type="button" hidden>Retry</button>
        </div>
      </div>
      <div id="error-banner" class="panel error-banner" role="alert" hidden>
        <span id="error-message"></span><button id="error-retry" type="button">Retry</button
        ><button id="error-close" type="button" aria-label="Close error">×</button>
      </div>
      <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
      <aside id="drawer" class="panel drawer" aria-label="Map panel" hidden>
        <button
          id="sheet-handle"
          class="sheet-handle"
          type="button"
          aria-label="Dismiss panel"
        ></button>
        <div class="drawer-head">
          <span id="drawer-title" class="eyebrow">Panel</span
          ><button
            id="drawer-close"
            class="icon-button"
            type="button"
            aria-label="Close panel"
          ></button>
        </div>
        <div id="drawer-body" class="drawer-body"></div>
      </aside>
      <div
        id="context-menu"
        class="panel context-menu"
        role="menu"
        aria-label="Map actions"
        hidden
      ></div>
      <div id="toasts" class="toasts" aria-live="polite"></div>
      <dialog id="shortcuts-dialog" aria-labelledby="shortcuts-title">
        <div class="dialog-head">
          <h2 id="shortcuts-title">Keyboard shortcuts</h2>
          <button id="shortcuts-close" type="button" aria-label="Close shortcuts">×</button>
        </div>
        <div id="shortcuts-body"></div>
      </dialog>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
